{% set name = "gfnff" %}
{% set version = "0.3.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/pprcht/gfnff/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 85cda9e0b8e22a9960e6f1e5af2a61c1e0eaf7fd975cbf635d61a0c66e7ac0dd

build:
  number: 0
  # Force the Ninja generator: conda-build defaults CMAKE_GENERATOR to
  # "Unix Makefiles", which makes scikit-build-core skip Ninja detection and
  # never set CMAKE_MAKE_PROGRAM (there is no `make` in the build image).
  script: CMAKE_GENERATOR=Ninja {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [win]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ compiler('fortran') }}
    - {{ stdlib('c') }}
    - cmake
    - ninja
    - libgomp      # [linux]
    - llvm-openmp  # [osx]
  host:
    - python
    - pip
    - scikit-build-core >=0.9
    - numpy
    - libblas
    - liblapack
    # use conda-forge's toml-f: without it CMake would download and vendor
    # its own copy during the build
    - toml-f-devel
  run:
    - python
    - numpy

test:
  imports:
    - gfnff
  requires:
    - pip
  commands:
    - pip check
    - gfnff --help
    # the library must have been built with TOML parameter file support
    - python -c "from gfnff._lib import toml_available; assert toml_available()"

about:
  home: https://github.com/pprcht/gfnff
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: Python bindings for the GFN-FF force-field library
  dev_url: https://github.com/pprcht/gfnff

extra:
  recipe-maintainers:
    - pprcht
